<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedha's Banner</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace; /* Fits the lofi tech vibe */
        }

        .banner-container {
            width: 1280px; /* Horizontal GitHub banner size */
            height: 400px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            isolation: isolate;
        }

        /* 1. The Animated Background */
        .banner-bg {
            position: absolute;
            inset: 0;
            background-image: url('new-background.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center 58%;
            z-index: 0;
            animation: panBackground 30s ease-in-out infinite alternate;
        }

        @keyframes panBackground {
            0% { transform: scale(1.02) translate(1%, 0); }
            100% { transform: scale(1.12) translate(-1.5%, -2.5%); }
        }

        .banner-container::before {
            content: "";
            position: absolute;
            inset: -35%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
            background:
                radial-gradient(ellipse at 72% 38%, rgba(113, 225, 255, 0.35), transparent 34%),
                radial-gradient(ellipse at 24% 72%, rgba(255, 116, 188, 0.2), transparent 38%);
            mix-blend-mode: screen;
            animation: ambientDrift 18s ease-in-out infinite alternate;
        }

        @keyframes ambientDrift {
            0% { transform: translate3d(-3%, 2%, 0) scale(0.96); }
            100% { transform: translate3d(3%, -2%, 0) scale(1.06); }
        }

        /* 2. Dark Overlay for Text Readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 100%);
            z-index: 3;
        }

        /* 3. The Text */
        .text-container {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            z-index: 5;
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
            /* Typing Animation */
            display: inline-block;
            white-space: nowrap;
            animation: typing 1.3s steps(16, end) forwards;
        }

        .tagline {
            margin: 6px 0 0;
            color: #c8eff2;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.35rem;
            font-style: italic;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: translateY(8px);
            animation: taglineReveal 900ms ease-out 1s forwards;
        }

        .tagline::before,
        .tagline::after {
            content: "";
            display: inline-block;
            width: 28px;
            margin: 0 12px;
            border-top: 1px solid rgba(200, 239, 242, 0.65);
            vertical-align: middle;
        }

        @keyframes taglineReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typing Effect */
        @keyframes typing {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }

        h1 {
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
        }

        @media (prefers-reduced-motion: reduce) {
            .banner-bg,
            .banner-container::before,
            h1,
            .tagline {
                animation: none;
            }

            .tagline {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <div class="banner-bg"></div>
        <div class="overlay"></div>
        <div class="text-container">
            <h1>Hello I'm Vedha</h1>
            <p class="tagline">Veni, Vidi, Vici</p>
        </div>
    </div>

</body>
</html>
